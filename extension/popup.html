<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogMagang Auto-Fill Pro</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #059669;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 360px;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      padding: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 28px;
      height: 28px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.2px;
    }

    .brand-subtitle {
      font-size: 10px;
      color: var(--muted);
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      background: #e0e7ff;
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    select {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      background-color: #fff;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 8px;
      outline: none;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }

    .queue-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 5px 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }

    .queue-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 7px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
    }

    .queue-btn:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .queue-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .logbook-preview {
      font-size: 11px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      color: #334155;
      max-height: 115px;
      overflow-y: auto;
    }

    .preview-row {
      margin-bottom: 4px;
    }

    .preview-label {
      font-weight: 700;
      color: #1e293b;
    }

    .word-counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .word-valid {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .word-invalid {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    textarea {
      width: 100%;
      height: 60px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      resize: vertical;
      margin-bottom: 8px;
      background: #ffffff;
      color: var(--text);
    }

    textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      margin-bottom: 6px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #ffffff;
      color: #334155;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #f1f5f9;
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1px dashed var(--primary);
      font-size: 11px;
      padding: 5px 8px;
      margin-bottom: 6px;
    }

    .btn-outline:hover {
      background: #eef2ff;
    }

    .footer-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .footer-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .toast {
      display: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    .toast-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .toast-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">LM</div>
      <div>
        <div class="brand-title">LogMagang Auto-Fill</div>
        <div class="brand-subtitle">Multi-Portal Preset & Batch Queue</div>
      </div>
    </div>
    <span class="status-badge" id="storage-status">Ready</span>
  </header>

  <div id="toast" class="toast"></div>

  <!-- Target Portal Selection -->
  <div class="card" style="padding: 10px 12px; margin-bottom: 8px;">
    <label style="font-size: 11px; font-weight: 700; color: #475569; display: block; margin-bottom: 4px;">
      🏫 Target Portal Kampus:
    </label>
    <select id="portal-preset">
      <option value="kemdikbud">1. Portal Kampus Merdeka / MSIB Pusat</option>
      <option value="ipb">2. Student Portal IPB (AktivitasKampusMerdeka)</option>
      <option value="ugm">3. Simaster UGM / Cybercampus</option>
      <option value="siakad">4. SIAKAD / Neo Feeder Generic</option>
      <option value="custom">5. Custom Selector Mode (Klik Elemen Layar)</option>
    </select>
  </div>

  <!-- Kartu Data Logbook Aktif & Batch Queue -->
  <div class="card">
    <div class="card-title">
      <span>Data Logbook Aktif</span>
      <span style="font-size: 10px; color: var(--muted);" id="date-label">-</span>
    </div>

    <!-- Batch Queue Navigator (Tampil jika data berupa array/mingguan) -->
    <div id="queue-box" class="queue-navigator" style="display: none;">
      <button id="btn-queue-prev" class="queue-btn">◀ Prev</button>
      <span id="queue-info" style="font-weight: 700; color: #1e1b4b;">Hari 1 dari 5</span>
      <button id="btn-queue-next" class="queue-btn">Next ▶</button>
    </div>

    <div class="logbook-preview" id="preview-box">
      <em>Belum ada data logbook. Tempelkan (paste) JSON hasil LogMagang di bawah.</em>
    </div>

    <!-- Word Counter Validation Indicator -->
    <div id="word-counter-badge" class="word-counter-badge word-valid" style="display: none;">
      <span>📝</span>
      <span id="word-count-text">0 kata</span>
    </div>

    <button id="btn-autofill-active" class="btn btn-primary">
      ⚡ Kirim & Isi ke Tab Portal Aktif
    </button>
  </div>

  <!-- Kartu Input / Paste JSON -->
  <div class="card">
    <div class="card-title">
      <span>Input Data LogMagang</span>
    </div>

    <textarea id="json-input" placeholder='Paste payload JSON dari web LogMagang di sini (klik "Salin Data untuk Ekstensi" di web)...'></textarea>

    <div style="display: flex; gap: 6px; margin-bottom: 6px;">
      <button id="btn-save-json" class="btn btn-secondary" style="flex: 1;">
        💾 Simpan Data
      </button>
      <label class="btn btn-secondary" style="flex: 1; margin-bottom: 0; text-align: center; cursor: pointer;">
        📂 Upload JSON
        <input type="file" id="file-upload" accept=".json,.csv" style="display: none;">
      </label>
    </div>

    <button id="btn-sample-data" class="btn btn-outline">
      ✨ Gunakan Contoh Data 1 Pekan (Batch)
    </button>
  </div>

  <div class="footer-links">
    <span>v2.0.0 (Enterprise)</span>
    <a href="http://localhost:3000" target="_blank" id="btn-open-web">Buka Web LogMagang ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
